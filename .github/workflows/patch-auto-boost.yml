name: Apply Auto Boost fix

on:
  push:
    branches: [fix/auto-boost-bootstrap]
    paths:
      - '.github/workflows/patch-auto-boost.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/auto-boost-bootstrap
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply reliability patch
        run: node scripts/apply-auto-boost-fix.mjs
      - name: Commit patched extension
        run: |
          git config user.name "OneBlock Analytics CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix Auto Boost bootstrap and E input diagnostics"
          git push origin HEAD:fix/auto-boost-bootstrap
