name: Apply v0.3.4 cleanup

on:
  push:
    branches: [feature/precision-dumb-v034]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/precision-dumb-v034
          fetch-depth: 0
      - name: Apply cleanup
        run: python3 scripts/fix-v034-types-ui.py
      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "OneBlock Analytics CI"
          git config user.email "actions@users.noreply.github.com"
          git add extension/background-v3.ts src/types.ts src/views/LiveExtension.tsx
          git commit -m "Fix v0.3.4 types and precision guards"
          git push origin HEAD:feature/precision-dumb-v034
