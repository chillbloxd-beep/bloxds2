name: Apply v0.3.2 live-state patch

on:
  push:
    branches: [fix/live-state-v032]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-state-v032
          fetch-depth: 0
      - name: Apply live-state patch
        run: |
          python3 scripts/fix-v032-recursion.py
          python3 scripts/patch-live-state-v032.py
          python3 scripts/fix-v032-recursion.py
          python3 scripts/fix-v032-final.py
      - name: Commit patch if changed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Patch already applied."
            exit 0
          fi
          git config user.name "OneBlock Analytics CI"
          git config user.email "actions@users.noreply.github.com"
          git add extension/background-v3.ts src/views/LiveExtension.tsx src/styles.css package.json extension/public/manifest.json README.md
          git commit -m "Finalize v0.3.2 live refresh and boost logging"
          git push origin HEAD:fix/live-state-v032
