name: Apply v0.3.7 final reliability migration

on:
  push:
    branches:
      - fix/v037-final-polish
    paths:
      - .github/workflows/apply-v037-final.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[v037-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v037-final-polish
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tighten final-lock agreement and current audit before migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-v037-final.py')
          text = p.read_text()

          old = 'return cooldownSamplesAgree(first, second, FINAL_LOCK_AGREEMENT_MS);'
          new = 'return Math.abs(cooldownReadyEstimateMs(first) - cooldownReadyEstimateMs(second)) < FINAL_LOCK_AGREEMENT_MS;'
          if text.count(old) != 1:
              raise SystemExit(f'expected one final-lock helper target, found {text.count(old)}')
          text = text.replace(old, new, 1)

          anchor = 'text = replace_once(text, old_audit, new_audit, "v0.3.7 audit invariants")'
          insertion = anchor + '\ntext = text.replace(\'expect(background.includes("precisionWindowActive || nearReady"), "counter is not pre-deferred just before the precision window");\', \'expect(background.includes("boundaryBurstRunning || Boolean(boostCycle) || nearReady"), "counter is not pre-deferred across the final lock/input/verification window");\')'
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one audit insertion anchor, found {text.count(anchor)}')
          text = text.replace(anchor, insertion, 1)
          p.write_text(text)
          PY
      - name: Apply deterministic migration
        run: python3 scripts/apply-v037-final.py
      - name: Remove migration-only helpers before validation
        run: |
          rm scripts/apply-v037-final.py
          rm .github/workflows/apply-v037-final.yml
      - name: Install dependencies
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Website typecheck and build
        run: npm run build
      - name: Extension typecheck and build
        run: npm run build:extension
      - name: Extension release audit
        run: npm run audit:extension
      - name: Diff hygiene
        run: |
          git diff --check
          test ! -e scripts/apply-v037-final.py
          test ! -e .github/workflows/apply-v037-final.yml
          test ! -e package-lock.json
          test ! -d dist-extension || test -z "$(git ls-files dist-extension)"
      - name: Commit verified v0.3.7 source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix v0.3.7 Ready boundary latency [v037-applied]"
          git push origin HEAD:fix/v037-final-polish
