name: Finish v0.3.7 Chopping OCR fallback

on:
  push:
    branches: [fix/v037-final-polish]
    paths:
      - 'scripts/finish-v037-chopping-fallback.py'
      - '.github/workflows/finish-v037-chopping-fallback.yml'

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v037-final-polish
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded fallback patch
        run: python3 scripts/finish-v037-chopping-fallback.py
      - name: Remove migration-only helpers
        run: |
          rm scripts/finish-v037-chopping-fallback.py
          rm .github/workflows/finish-v037-chopping-fallback.yml
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Website typecheck and build
        run: npm run build
      - name: Extension typecheck and build
        run: npm run build:extension
      - name: Extension release audit
        run: npm run audit:extension
      - name: Diff hygiene
        run: |
          git diff --check
          test -z "$(git ls-files dist-extension package-lock.json)"
      - name: Commit verified source
        run: |
          git config user.name "chillbloxd-beep"
          git config user.email "chill.bloxd@gmail.com"
          git add extension/background-v3.ts src/extension/reliability.test.ts src/extension/ocrCalibration.test.ts scripts/audit-extension.mjs scripts/finish-v037-chopping-fallback.py .github/workflows/finish-v037-chopping-fallback.yml
          git commit -m "Fix v0.3.7 Chopping OCR fallback latency"
          git push origin HEAD:fix/v037-final-polish
