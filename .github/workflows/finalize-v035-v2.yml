name: Finalize v0.3.5 source v2

on:
  push:
    branches:
      - feature/reliability-performance-v035
    paths:
      - scripts/run-finalize-v035.py
      - .github/workflows/finalize-v035-v2.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/reliability-performance-v035
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply corrected guarded source patch
        run: python3 scripts/run-finalize-v035.py
      - name: Remove all one-time finalization files before audit
        run: |
          rm -f scripts/finalize-v035.py scripts/run-finalize-v035.py scripts/refine-v035-background.py
          rm -f .github/workflows/finalize-v035.yml .github/workflows/finalize-v035-v2.yml
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm run build:extension
      - run: npm run audit:extension
      - name: Commit only after tests, builds and audit pass
        run: |
          git config user.name "OneBlock Analytics CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize v0.3.5 low-overhead monitor and diagnostics"
          git push origin HEAD:feature/reliability-performance-v035
