name: CI

on:
  push:
    branches:
      - main
      - 'build/**'
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm run build:extension
      - run: npm run audit:extension
      - name: Validate extension bundle
        run: |
          test -f dist-extension/manifest.json
          test -f dist-extension/background.js
          test -f dist-extension/sidepanel.html
          test -f dist-extension/monitor.html
          test -f dist-extension/offscreen.html
          test -f dist-extension/ocr/worker.min.js
          test -f dist-extension/ocr/lang/eng.traineddata.gz
          test -f dist-extension/ocr/core/tesseract-core.wasm.js
          test -f dist-extension/ocr/core/tesseract-core-simd.wasm.js
          test -f dist-extension/ocr/core/tesseract-core-lstm.wasm.js
          test -f dist-extension/ocr/core/tesseract-core-simd-lstm.wasm.js
      - name: Upload extension ZIP artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: oneblock-analytics-extension
          path: dist-extension
          if-no-files-found: error
          compression-level: 9
