name: Fix v0.3.2 alarm typecheck

on:
  push:
    branches: [fix/live-state-v032]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-state-v032
      - name: Fix alarm timestamp type
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('extension/background-v3.ts')
          s = p.read_text()
          old = 'chrome.alarms.create(BOOST_WAKE, { when: boostWakeAt });'
          new = 'chrome.alarms.create(BOOST_WAKE, { when: boostWakeAt! });'
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s)
          elif new not in s:
              raise SystemExit('alarm target not found')
          PY
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "OneBlock Analytics CI"
          git config user.email "actions@users.noreply.github.com"
          git add extension/background-v3.ts
          git commit -m "Fix boost alarm timestamp typecheck"
          git push origin HEAD:fix/live-state-v032
