name: Finalize v0.3.7 release

on:
  push:
    branches: [fix/v037-final-polish]
    paths:
      - scripts/finalize-v037-release.py
      - .github/workflows/finalize-v037-release.yml

permissions:
  contents: write

jobs:
  finalize-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v037-final-polish
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded finalization
        run: python3 scripts/finalize-v037-release.py
      - name: Remove finalization-only helpers
        run: |
          rm scripts/finalize-v037-release.py
          rm .github/workflows/finalize-v037-release.yml
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Website build
        run: npm run build
      - name: Extension build
        run: npm run build:extension
      - name: Extension release audit
        run: npm run audit:extension
      - name: Diff hygiene
        run: |
          git diff --check
          test ! -e scripts/finalize-v037-release.py
          test ! -e .github/workflows/finalize-v037-release.yml
          unexpected="$(git diff --diff-filter=ACMRT --name-only | grep -Ev '^(README.md|extension/background-v3.ts|scripts/audit-extension.mjs|src/extension/reliability.ts|src/extension/reliability.test.ts|src/views/LiveExtension.tsx)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected modified/added finalization files:"
            echo "$unexpected"
            exit 1
          fi
      - name: Commit verified final source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md extension/background-v3.ts scripts/audit-extension.mjs src/extension/reliability.ts src/extension/reliability.test.ts src/views/LiveExtension.tsx scripts/finalize-v037-release.py .github/workflows/finalize-v037-release.yml
          if git diff --cached --quiet; then
            echo 'No final changes to commit.'
            exit 1
          fi
          git commit -m 'Finalize v0.3.7 release timing and documentation'
          git push origin HEAD:fix/v037-final-polish
