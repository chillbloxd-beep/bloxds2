name: Apply v0.3.3 bounded OCR patch

on:
  push:
    branches: [feature/low-overhead-v033]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/low-overhead-v033
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/patch-low-overhead-v033b.py
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "OneBlock Analytics CI"
          git config user.email "actions@users.noreply.github.com"
          git add extension/background-v3.ts src/views/LiveExtension.tsx
          git commit -m "Bound live OCR work while mining"
          git push origin HEAD:feature/low-overhead-v033
