name: Apply v0.3.5 background reliability patch

on:
  push:
    branches:
      - feature/reliability-performance-v035

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply v0.3.5 background reliability patch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/reliability-performance-v035
          fetch-depth: 0
      - name: Apply reliability migration
        run: python scripts/apply-v035-background.py
      - name: Remove one-time migration files
        run: rm scripts/apply-v035-background.py .github/workflows/apply-v035-background.yml
      - name: Commit migration
        run: |
          git config user.name "OneBlock Analytics CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Apply v0.3.5 background reliability patch"
          git push origin HEAD:feature/reliability-performance-v035
