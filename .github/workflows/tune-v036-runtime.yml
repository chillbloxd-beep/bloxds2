name: Tune v0.3.6 runtime

on:
  push:
    branches:
      - fix/v036-live-reliability

permissions:
  contents: write

jobs:
  tune-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[v036-tuned]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v036-live-reliability
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply final guarded runtime tuning
        run: python3 scripts/tune-v036-runtime.py
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build:extension
      - name: Commit validated runtime tuning
        run: |
          git config user.name "chillbloxd-beep"
          git config user.email "chill.bloxd@gmail.com"
          git add extension/background-v3.ts
          test -n "$(git diff --cached --name-only)"
          git commit -m "Tune v0.3.6 runtime recovery and precision [v036-tuned]"
          git push origin HEAD:fix/v036-live-reliability
