name: Apply v0.3.4 duplicate fix

on:
  push:
    branches: [feature/precision-dumb-v034]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/precision-dumb-v034
          fetch-depth: 0
      - name: Apply duplicate fix
        run: python3 scripts/fix-v034-duplicate.py
      - name: Commit duplicate fix
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "OneBlock Analytics CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/views/LiveExtension.tsx
          git commit -m "Remove duplicate v0.3.4 rate formatter"
          git push origin HEAD:feature/precision-dumb-v034
