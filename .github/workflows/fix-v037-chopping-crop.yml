name: Fix v0.3.7 Chopping OCR fallback

on:
  push:
    branches: [fix/v037-final-polish]
    paths:
      - 'scripts/fix-v037-chopping-crop.py'
      - '.github/workflows/fix-v037-chopping-crop.yml'

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v037-final-polish
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded Chopping OCR fix
        run: python3 scripts/fix-v037-chopping-crop.py
      - name: Remove migration-only helpers before validation
        run: |
          rm scripts/fix-v037-chopping-crop.py
          rm .github/workflows/fix-v037-chopping-crop.yml
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Website typecheck and build
        run: npm run build
      - name: Extension typecheck and build
        run: npm run build:extension
      - name: Extension release audit
        run: npm run audit:extension
      - name: Diff hygiene
        run: |
          git status --short
          git diff --check
          test -z "$(git ls-files dist-extension package-lock.json)"
      - name: Commit verified fix
        run: |
          git config user.name "chillbloxd-beep"
          git config user.email "chill.bloxd@gmail.com"
          git add extension/background-v3.ts src/extension/ocrCalibration.ts src/extension/offscreen.ts src/extension/reliability.test.ts src/extension/ocrCalibration.test.ts scripts/audit-extension.mjs scripts/fix-v037-chopping-crop.py .github/workflows/fix-v037-chopping-crop.yml
          git commit -m "Fix v0.3.7 Chopping OCR crop fallback"
          git push origin HEAD:fix/v037-final-polish
